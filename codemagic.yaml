workflows:
  aquenys-release:
    name: AQUENYS Android AAB
    max_build_duration: 30

    environment:
      java: 21
      node: 20
      android_signing:
        - aquenys_upload

    scripts:
      - name: Install dependencies
        script: |
          npm install --include=dev --registry=https://registry.npmjs.org/

      - name: Sync Capacitor Android
        script: |
          node node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Build signed release AAB
        script: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$CM_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password="$CM_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$CM_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$CM_KEY_PASSWORD"

    artifacts:
      - android/app/build/outputs/bundle/release/app-release.aab
