<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AQUENYS</title><link rel="stylesheet" href="style.css"></head><body>
<main id="app"><header><div id="day">DÍA 1<br><span id="clock">00:00:00</span></div><div class="stability">ESTABILIDAD <b id="stability">100%</b><span id="status">PERFECTO</span></div><div class="protect">PROTECCIÓN<br><small id="protection">Disponible</small></div></header>
<section id="aquarium"><div class="light"></div><div class="plant p1">🌿</div><div class="plant p2">🌱</div><div class="fish f1">🐠</div><div class="fish f2">🐟</div><div class="fish f3">🐡</div><div id="bubbles"></div><div id="food"></div></section>
<section class="controls"><article><h3>🫧 OXÍGENO</h3><progress id="oxygenBar" max="100"></progress><b id="oxygen">100%</b><small>90 segundos</small><button data-action="oxygen">Oxigenar</button></article><article><h3>🐟 ALIMENTO</h3><progress id="foodBar" max="100"></progress><b id="foodValue">100%</b><small>60 segundos</small><button data-action="food">Alimentar</button></article><article><h3>💧 LIMPIEZA</h3><progress id="cleanBar" max="100"></progress><b id="clean">100%</b><small>2 minutos</small><button data-action="clean">Filtrar agua</button></article></section>
<section class="bonus"><b>⭐ BONO DE PROTECCIÓN</b><span>2 horas · deterioro 75% más lento · mantenimiento x2</span><button id="reward">Ver 2 anuncios</button></section><footer>Espacio reservado para banner AdMob de prueba</footer></main><script src="app.js"></script></body></html>
